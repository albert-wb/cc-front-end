<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - IngressosFácil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-md bg-dark" data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-ticket-perforated me-2" aria-hidden="true"></i>IngressosFácil
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
            aria-controls="menuPrincipal" aria-expanded="false" aria-label="Alternar menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><i class="bi bi-house" aria-hidden="true"></i> Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#eventos"><i class="bi bi-calendar-event"
                        aria-hidden="true"></i> Eventos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="cadastro.html"><i class="bi bi-person-plus"
                        aria-hidden="true"></i> Cadastro</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#contato"><i class="bi bi-envelope" aria-hidden="true"></i>
                        Contato</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h3 mb-4">Criar conta</h1>

                        <!-- Container para exibir o alerta verde -->
                        <div id="alertaContainer"></div>

                        <form id="registerForm" method="POST">
                            <div class="mb-3">
                                <label for="nome" class="form-label">Nome completo</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person" aria-hidden="true"></i></span>
                                    <input type="text" class="form-control" id="nome" name="nome" placeholder="Seu nome" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">E-mail</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope" aria-hidden="true"></i></span>
                                    <input type="email" class="form-control" id="email" name="email"
                                    placeholder="voce@exemplo.com" required>
                                </div>
                                <div class="form-text">Nunca compartilhamos seu e-mail.</div>
                            </div>
                            <div class="mb-3">
                                <label for="senha" class="form-label">Senha</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock" aria-hidden="true"></i></span>
                                    <input type="password" class="form-control" id="senha" name="senha"
                                    placeholder="Mínimo de 8 caracteres" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="categoria" class="form-label">Categoria preferida</label>
                                <select class="form-select" id="categoria" name="categoria">
                                    <option value="" selected>Selecione...</option>
                                    <option value="show">Shows</option>
                                    <option value="comedia">Comédia</option>
                                    <option value="esporte">Esportes</option>
                                    <option value="gastronomia">Gastronomia</option>
                                </select>
                            </div>
                            <div class="form-check form-switch mb-3">
                                <input class="form-check-input" type="checkbox" role="switch" id="novidades" name="novidades">
                                <label class="form-check-label" for="novidades">Receber novidades por e-mail</label>
                            </div>
                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="termos" name="termos" required>
                                <label class="form-check-label" for="termos">Li e aceito os termos de uso</label>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer id="contato" class="bg-dark text-light text-center py-3 mt-auto">
        <small>&copy; 2026 IngressosFácil. Todos os direitos reservados.</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
    <script>
        // ==========================================
        // Aula 14 - Manipulação do DOM com JavaScript
        // Projeto: Formulário de cadastro com JavaScript
        // ==========================================

        // Passo 1: Selecionar o formulário e o container do alerta
        const formCadastro = document.getElementById('registerForm');
        const alertaContainer = document.getElementById('alertaContainer');

        // Passo 2: Adicionar ouvinte para o evento de envio (submit)
        formCadastro.addEventListener('submit', function (event) {
            // Passo 3: Impedir o comportamento padrão de recarregar a página
            event.preventDefault();

            // Passo 4: Ler os dados dos campos do formulário
            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const selectCategoria = document.getElementById('categoria');
            const categoriaTexto = selectCategoria.value 
                ? selectCategoria.options[selectCategoria.selectedIndex].text 
                : 'Não informada';
            const novidades = document.getElementById('novidades') ? document.getElementById('novidades').checked : false;
            const termos = document.getElementById('termos').checked;

            // Passo 5: Agrupar os dados lidos em um objeto (sem incluir a senha no resumo)
            const usuario = {
                nome: nome,
                email: email,
                categoria: categoriaTexto,
                novidades: novidades,
                termos: termos
            };

            console.log('Objeto do usuário cadastrado:', usuario);

            // Passo 6: Exibir alerta verde na tela (alert alert-success do Bootstrap)
            // com nome, e-mail e categoria escolhida, sem mostrar a senha
            alertaContainer.innerHTML = `
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                    <h5 class="alert-heading mb-2"><i class="bi bi-check-circle-fill me-2"></i>Cadastro realizado com sucesso!</h5>
                    <p class="mb-1"><strong>Nome:</strong> ${usuario.nome}</p>
                    <p class="mb-1"><strong>E-mail:</strong> ${usuario.email}</p>
                    <p class="mb-0"><strong>Categoria:</strong> ${usuario.categoria}</p>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
                </div>
            `;

            // Passo 7: Limpar o formulário depois do cadastro
            formCadastro.reset();
        });
    </script>
</body>
</html>
